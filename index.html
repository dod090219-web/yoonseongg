<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단일 페이지 웹사이트 - 소통</title>
<style>
    /* 전체 페이지 설정 */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0; /* 페이지 배경색 (계획서 밖의 색상) */
    }

    /* 옅은 파란색 배경 영역 (목표 디자인) */
    .container {
        background-color: #cfe2f3; /* 옅은 파란색 */
        border: 1px solid #737373; /* 테두리 */
        width: 600px;
        height: 400px;
        padding: 20px;
        position: relative;
    }

    /* 상단 "질문포럼" 영역 */
    .header-box {
        background-color: #eeeeee; /* 밝은 회색 */
        border: 1px solid #a3a3a3; /* 테두리 */
        border-radius: 10px; /* 둥근 모서리 */
        width: 300px;
        height: 50px;
        margin: 0 auto 30px auto; /* 중앙 정렬 및 아래쪽 여백 */
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        color: #333;
    }

    /* 좌측 화살표 버튼 컨테이너 */
    .menu-container {
        display: flex;
        flex-direction: column;
        gap: 20px; /* 버튼 사이 간격 */
        padding-left: 30px;
    }

    /* 화살표 모양 버튼 스타일 */
    .arrow-btn {
        position: relative;
        background-color: white;
        border: 1px solid #a3a3a3;
        width: 80px;
        height: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
        color: #333;
        text-decoration: none; /* 링크 밑줄 제거 */
        cursor: pointer;
    }

    /* 화살표 머리 부분 만들기 (가상 요소 사용) */
    .arrow-btn::after {
        content: "";
        position: absolute;
        right: -15px; /* 화살표 위치 조정 */
        top: -1px; /* 화살표 높이 조정 */
        border-top: 16px solid transparent;
        border-bottom: 16px solid transparent;
        border-left: 15px solid white; /* 안쪽 색상 */
        z-index: 2;
    }

    /* 화살표 테두리 만들기 (가상 요소 사용) */
    .arrow-btn::before {
        content: "";
        position: absolute;
        right: -17px;
        top: -2px;
        border-top: 17px solid transparent;
        border-bottom: 17px solid transparent;
        border-left: 16px solid #a3a3a3; /* 테두리 색상 */
        z-index: 1;
    }
</style>
</head>
<body>

<div class="container">
    <!-- 상단 질문포럼 영역 -->
    <div class="header-box">
        질문포럼
    </div>

    <!-- 좌측 메뉴 영역 -->
    <div class="menu-container">
        <!-- 버튼을 클릭 가능하게 만들려면 a 태그를 사용하세요 -->
        <a href="#" class="arrow-btn">자 유</a> 질문
        <a href="#" class="arrow-btn">질 문</a> 실축,평가,경기        
        <a href="#" class="arrow-btn">평 가</a> 경기 평점
    </div>
</div>

</body>
</html>
